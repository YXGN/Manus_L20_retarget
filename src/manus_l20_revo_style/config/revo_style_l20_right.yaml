# Revo-style MANUS ergonomics retargeting adapted to L20 20-slot commands.
#
# The reference Revo3 pipeline treats MANUS Stretch ergonomics as degree-like
# joint angles, applies per-joint scale/offset, maps spread relative to the
# middle finger, then publishes a smoothed joint command. This config keeps that
# structure but adapts the output to L20 command slots.

input:
  side: right
  # Optional neutral ergonomics values subtracted before flexion mapping.
  # Leave at 0.0 for the Revo-style direct degree mapping.
  neutral_ergonomics:
    IndexMCPStretch: 0.0
    IndexPIPStretch: 0.0
    IndexDIPStretch: 0.0
    MiddleMCPStretch: 0.0
    MiddlePIPStretch: 0.0
    MiddleDIPStretch: 0.0
    RingMCPStretch: 0.0
    RingPIPStretch: 0.0
    RingDIPStretch: 0.0
    PinkyMCPStretch: 0.0
    PinkyPIPStretch: 0.0
    PinkyDIPStretch: 0.0
    ThumbMCPStretch: 0.0
    ThumbPIPStretch: 0.0
    ThumbDIPStretch: 0.0

four_finger:
  index_angle_scale: 1.0
  all_finger_angle_scale: 1.0
  four_finger_mcp_scale: 1.0
  middle_ring_dip_scale: 1.0
  pinky_angle_scale: 1.0
  pinky_mcp_scale: 1.0
  pinky_dip_pip_scale: 1.0

spread:
  finger_spread_sign: -1.0
  middle_dynamic: true
  index_offset_deg: 15.0
  middle_offset_deg: -5.0
  ring_offset_deg: -5.0
  pinky_offset_deg: 0.0
  index_scale: 1.0
  middle_scale: 1.0
  ring_scale: 1.0
  pinky_scale: 1.0
  ring_forward_scale: 1.0
  ring_backward_scale: 1.0

thumb:
  # Simple Revo-style ergonomics mapping for L20. The existing landmark segment
  # IK path can still be used separately for higher-quality thumb roll/yaw.
  mcp_scale: 1.0
  pip_scale: 1.2
  dip_scale: 1.2
  mcp_offset_deg: 0.0
  pip_offset_deg: 0.0
  dip_offset_deg: 0.0
  spread_key: ThumbMCPSpread
  spread_offset_deg: 0.0
  spread_scale: -1.0

joint_calibration:
  # Per-intermediate-joint calibration after MANUS -> rad conversion.
  default_scale: 1.0
  default_offset_deg: 0.0
  joints:
    index_mcp: {scale: 1.0, offset_deg: 8.0}
    index_pip: {scale: 1.2, offset_deg: 12.0}
    index_dip: {scale: 1.0, offset_deg: 9.0}
    middle_mcp: {scale: 1.0, offset_deg: 5.0}
    middle_pip: {scale: 1.2, offset_deg: 5.0}
    middle_dip: {scale: 1.0, offset_deg: 0.0}
    ring_mcp: {scale: 1.0, offset_deg: 5.0}
    ring_pip: {scale: 1.2, offset_deg: 5.0}
    ring_dip: {scale: 1.0, offset_deg: 9.0}
    pinky_mcp: {scale: 1.0, offset_deg: 4.0}
    pinky_pip: {scale: 1.2, offset_deg: 12.0}
    pinky_dip: {scale: 1.0, offset_deg: 9.0}
    thumb_mcp: {scale: 1.0, offset_deg: -4.0}
    thumb_pip: {scale: 1.2, offset_deg: 10.0}
    thumb_dip: {scale: 1.0, offset_deg: 10.0}
    thumb_roll: {scale: 1.0, offset_deg: 0.0}
    thumb_yaw: {scale: 1.0, offset_deg: 0.0}

l20_command:
  # Slot layout: 0:5 base, 5:10 yaw/roll, 10:15 thumb yaw/reserved, 15:20 tip.
  # Four-finger root/tip can bypass the Revo joint-angle layer and map MANUS
  # ergonomics ranges directly to L20 command bytes. This matches the L20
  # control surface better: open -> 255, closed -> 0.
  direct_ergonomics_mapping: true
  ergonomics_ranges:
    index:
      root_key: IndexMCPStretch
      root_range: [0.0, 85.0]
      tip_key: IndexPIPStretch
      tip_range: [0.0, 75.0]
    middle:
      root_key: MiddleMCPStretch
      root_range: [0.0, 80.0]
      tip_key: MiddlePIPStretch
      tip_range: [0.0, 90.0]
    ring:
      root_key: RingMCPStretch
      root_range: [0.0, 75.0]
      tip_key: RingPIPStretch
      tip_range: [0.0, 90.0]
    pinky:
      root_key: PinkyMCPStretch
      root_range: [0.0, 60.0]
      tip_key: PinkyPIPStretch
      tip_range: [0.0, 80.0]
    thumb:
      root_key: ThumbMCPStretch
      root_range: [0.0, 35.0]
      tip_key: ThumbPIPStretch
      tip_range: [0.0, 25.0]
  neutral_command: [180, 255, 255, 255, 255, 150, 163, 129, 86, 62, 180, 255, 255, 255, 255, 220, 255, 255, 255, 255]
  min_command: [80, 0, 0, 0, 0, 0, 0, 60, 46, 0, 80, 255, 255, 255, 255, 80, 0, 0, 0, 0]
  max_command: [255, 255, 255, 255, 255, 255, 255, 169, 180, 190, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255]
  open_command: [180, 255, 255, 255, 255, 150, 163, 129, 86, 62, 180, 255, 255, 255, 255, 220, 255, 255, 255, 255]
  closed_command: [120, 13, 0, 5, 15, 0, 60, 85, 136, 166, 100, 255, 255, 255, 255, 100, 12, 12, 2, 9]
  joint_ranges_deg:
    thumb_mcp: [0.0, 70.0]
    thumb_tip: [0.0, 70.0]
    thumb_roll: [-35.0, 35.0]
    thumb_yaw: [-45.0, 45.0]
    index_mcp: [0.0, 95.0]
    index_tip: [0.0, 95.0]
    index_spread: [-35.0, 35.0]
    middle_mcp: [0.0, 95.0]
    middle_tip: [0.0, 95.0]
    middle_spread: [-20.0, 20.0]
    ring_mcp: [0.0, 95.0]
    ring_tip: [0.0, 95.0]
    ring_spread: [-35.0, 35.0]
    pinky_mcp: [0.0, 95.0]
    pinky_tip: [0.0, 95.0]
    pinky_spread: [-40.0, 40.0]

smoothing:
  lowpass_alpha: 0.45
  max_delta_per_cycle: 10
  interpolation_hz: 120.0
