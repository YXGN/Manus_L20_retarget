  # root_rad = angle at landmarks[1]-[2]-[3] (thumb root)
  # tip_rad  = angle at landmarks[2]-[3]-[4] (thumb tip)
  thumb_pinky_root_touch:
    root_rad: 0.056877
    tip_rad: 1.348886
  # MANUS measured thumb flexion at the natural-open pose.
  thumb_natural_open:
    root_rad: 0.00261
