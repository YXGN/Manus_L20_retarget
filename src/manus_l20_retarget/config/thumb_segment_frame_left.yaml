schema: manus_l20.thumb_segment_frame.v1
# Left thumb segment IK two-pose frame calibration.
#
# This file aligns the MANUS thumb segment vector to the L20 thumb IK model
# using two poses:
#   open  -> natural thumb-open pose
#   touch -> thumb touching the pinky-root pose
#
# The runtime uses manus_open_vector and manus_touch_vector to build a stable
# MANUS thumb motion plane. It uses robot_open_command and robot_touch_command
# to build the corresponding L20 thumb motion plane.
segment_start: 2
segment_end: 3
# MANUS thumb segment indexes used for IK target vector:
#   segment_start=2 and segment_end=3 mean landmarks[2] -> landmarks[3].
manus_open_vector:
- -0.017074
- 0.023478
- 0.00752
manus_touch_vector:
- 0.008601
- 0.025966
- 0.012302
robot_open_command:
- 254  # 0  Thumb Base
- 248  # 1  Index Base
- 246  # 2  Middle Base
- 249  # 3  Ring Base
- 254  # 4  Pinky Base
- 128  # 5  Thumb Roll
- 115  # 6  Index Yaw
- 111  # 7  Middle Yaw
- 131  # 8  Ring Yaw
- 188  # 9  Pinky Yaw
- 221  # 10  Thumb Yaw
- 255  # 11  Reserved
- 255  # 12  Reserved
- 255  # 13  Reserved
- 255  # 14  Reserved
- 254  # 15  Thumb Tip
- 254  # 16  Index Tip
- 254  # 17  Middle Tip
- 254  # 18  Ring Tip
- 254  # 19  Pinky Tip
robot_touch_command:
- 99   # 0  Thumb Base
- 255  # 1  Index Base
- 255  # 2  Middle Base
- 255  # 3  Ring Base
- 255  # 4  Pinky Base
- 0    # 5  Thumb Roll
- 163  # 6  Index Yaw
- 129  # 7  Middle Yaw
- 86   # 8  Ring Yaw
- 62   # 9  Pinky Yaw
- 222  # 10  Thumb Yaw
- 255  # 11  Reserved
- 255  # 12  Reserved
- 255  # 13  Reserved
- 255  # 14  Reserved
- 0    # 15  Thumb Tip
- 220  # 16  Index Tip
- 255  # 17  Middle Tip
- 255  # 18  Ring Tip
- 255  # 19  Pinky Tip
