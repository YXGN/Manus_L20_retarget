schema: manus_l20.finger_yaw_calibration.v1
# Right-hand four-finger yaw calibration.
#
# This file maps MANUS four-finger side-splay values to L20/G20 yaw commands.
# finger_order defines the command/angle array order:
#   0 index, 1 middle, 2 ring, 3 pinky
#
# source is the selected MANUS yaw feature used at runtime.
# source_mode records how the capture script chose it.
# source_ranges shows the open-to-close/spread motion range for each candidate.
#
finger_order:
- index
- middle
- ring
- pinky
source: pip_orientation
source_mode: auto_orientation
source_ranges:
  # Candidate yaw-feature ranges measured during capture. Larger and cleaner
  # ranges are usually better; auto_orientation selects from orientation sources.
  pip:
  - 0.0
  - 0.0
  - 0.0
  - 0.0
  dip:
  - 0.118632
  - 0.018698
  - 0.094271
  - 0.178409
  tip:
  - 0.129656
  - 0.017699
  - 0.103035
  - 0.211547
  mcp_orientation:
  - 0.0
  - 0.0
  - 0.0
  - 0.0
  pip_orientation:
  - 0.256019
  - 0.033496
  - 0.199002
  - 0.437091
  ip_orientation:
  - 0.254761
  - 0.033096
  - 0.19847
  - 0.437105
  dip_orientation:
  - 0.20839
  - 0.018238
  - 0.180303
  - 0.437019
