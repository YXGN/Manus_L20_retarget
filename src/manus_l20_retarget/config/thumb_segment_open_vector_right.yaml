schema: manus_l20.thumb_segment_open_vector.v1
# Right thumb segment IK legacy single-open-vector calibration.
#
# This file stores only the MANUS thumb open vector. It is kept as a fallback
# when thumb_segment_frame_right.yaml is missing or invalid.
#
# The newer preferred calibration is thumb_segment_frame_right.yaml, which uses
# both open and thumb-touch poses to define a full motion plane.
segment_start: 2
segment_end: 3
# MANUS thumb segment indexes used for IK target vector:
#   segment_start=2 and segment_end=3 mean landmarks[2] -> landmarks[3].
manus_open_vector:
- -0.01602
- 0.020709
- 0.01463
